version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ca_firm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ca_firm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ca_firm"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ca_firm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      APP_NAME: CA Firm Management API
      APP_ENV: development
      DEBUG: "true"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ca_firm
      JWT_SECRET_KEY: change_this_in_real_env
      JWT_ALGORITHM: HS256
      JWT_ISSUER: ca-firm-api
      JWT_AUDIENCE: ca-firm-users
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "15"
      STORAGE_MODE: mock
      APP_BASE_URL: http://localhost:8000
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: ca-firm-documents
      S3_PRESIGNED_EXPIRE_SECONDS: "900"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
